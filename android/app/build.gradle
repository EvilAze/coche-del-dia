apply plugin: 'com.android.application'

// Credenciales de firma del release, fuera del control de versiones.
// `android/keystore.properties` está en .gitignore junto a *.keystore y *.jks:
// sin la clave de subida no se pueden publicar actualizaciones en Play, así que
// no puede acabar en el repo ni por accidente.
//
// El fichero es OPCIONAL a propósito: si no existe (CI, un clon recién hecho,
// alguien que solo quiere compilar un debug) el build sigue funcionando y solo
// el `bundleRelease` sale sin firmar. Antes esto no estaba y la firma dependía
// del asistente de Android Studio, que no deja rastro en el repo de cómo se
// firmó.
//
// Plantilla en android/keystore.properties.example.
def ficheroKeystore = rootProject.file("keystore.properties")
def propsKeystore = new Properties()
if (ficheroKeystore.exists()) {
    ficheroKeystore.withInputStream { propsKeystore.load(it) }
}

android {
    namespace = "com.cochedeldia"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.cochedeldia"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 12
        versionName "1.1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Solo se rellena si existe keystore.properties. Gradle evalúa este
            // bloque siempre, así que sin el `if` petaría en cualquier máquina
            // que no tenga la clave — incluido un `assembleDebug`.
            if (ficheroKeystore.exists()) {
                storeFile file(propsKeystore['storeFile'])
                storePassword propsKeystore['storePassword']
                keyAlias propsKeystore['keyAlias']
                keyPassword propsKeystore['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Sin keystore.properties el release sale SIN FIRMAR en vez de
            // romper el build. Es lo que permite que un clon limpio compile.
            // Los paréntesis NO son decorativos: `signingConfig a ? b : c` sin
            // ellos es ambiguo para el parser de Groovy (se lee como la llamada
            // `signingConfig(a)` seguida de un ternario suelto).
            signingConfig(ficheroKeystore.exists() ? signingConfigs.release : null)
            // R8 activado: sin él, el dex del release iba SIN encoger (12,6 MB
            // descomprimidos) porque arrastraba entero Play Services Auth,
            // Credentials, OkHttp y coroutines aunque la app solo use una
            // fracción. Las keep rules las aportan los propios plugins vía
            // consumerProguardFiles (@capacitor/android mantiene las clases que
            // Capacitor instancia por reflexión; @capgo/capacitor-social-login
            // mantiene GMS Auth, Credentials y OkHttp), así que aquí solo
            // añadimos lo específico de esta app en proguard-rules.pro.
            minifyEnabled true
            // Poda recursos no referenciados (drawables/layouts/strings que
            // llegan de las librerías androidx y no usamos).
            shrinkResources true
            // -optimize en vez del perfil básico: mismo comportamiento en
            // cuanto a keep rules, pero deja que R8 optimice el bytecode.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    androidResources {
        // La app solo habla es/en (src/i18n). Sin este filtro empaquetamos los
        // strings de las ~50 locales que traen appcompat y play-services, que
        // no se usan nunca. AGP 8.7+ → localeFilters (antes resConfigs).
        localeFilters += ["es", "en"]
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
