<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: sin él, env(safe-area-inset-*) devuelve 0 en iOS y
         el CTA del fold rozaría la barra de gestos (ver .cdd-fold en index.css). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3eee1" />

    <!--
      Fuentes cargadas aquí con preconnect + <link> en lugar de @import en el
      CSS: el @import encadena descargas en serie y retrasa el render del título
      (el elemento más visible de la página). El preconnect abre la conexión a
      gstatic antes de necesitarla; display=swap evita el texto invisible (FOIT).
      gstatic va crossorigin (sirve los woff2).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Sistema «Prensa del motor»: Fraunces (display editorial, con itálica),
      Libre Franklin (UI/labels) y Courier Prime (cupón/datos). Mismo patrón
      preconnect + display=swap (anti-FOIT); pesos acotados a los que usa el
      sistema para no engordar el LCP. (F5: retiradas Archivo + Space Mono, ya
      sin uso tras portar todas las pantallas.)
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,400;1,9..144,600&family=Libre+Franklin:wght@400;600;800&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap"
    />

    <!--
      Favicons en orden de preferencia para los distintos consumidores:
        - favicon.ico (legacy, fallback universal Windows / Safari antiguos
          / Google Search Console; el .ico es multi-resolución y resuelve
          16/32/48 según contexto).
        - favicon-96x96.png (Chrome/Firefox/Edge en pestañas y bookmarks).
        - web-app-manifest-192x192.png (Google Search resultado de búsqueda
          en móvil; debe ser >=48x48 y múltiplo de 48 según
          https://developers.google.com/search/docs/appearance/favicon-in-search).
        - apple-touch-icon (iOS al añadir a pantalla de inicio).

      DECISIÓN: omitimos a propósito el <link rel="icon" type="image/svg+xml">
      aunque exista public/favicon.svg en el repo. Ese SVG es un wrapper
      generado por RealFaviconGenerator que contiene el PNG embebido en
      base64 — 391 KB para "renderizar" como pestaña de 16 px, sin ganar
      la nitidez vectorial que justifica el formato SVG. Si en el futuro
      tienes un SVG verdaderamente vectorial (Figma / Illustrator export
      sin raster), añade aquí el link y bórralo del bundle de iconos.

      El `?v=5` busta cualquier caché previa del navegador y del CDN tras
      el rebrand a "El Coche del Día". Si vuelves a cambiar los iconos,
      sube a v=6.
    -->
    <link rel="icon" href="/favicon.ico?v=5" sizes="any" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png?v=5" />
    <link rel="icon" type="image/png" sizes="192x192" href="/web-app-manifest-192x192.png?v=5" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=5" />
    <link rel="manifest" href="/manifest.json" />

    <title>El Coche del Día · Adivina el coche en 5 intentos</title>
    <meta name="description" content="¿Cuánto sabes de motor? Adivina la marca, modelo y año del coche del día en 5 intentos. Un nuevo reto automovilístico cada 24 horas. Juega gratis a El Coche del Día." />
    <meta name="keywords" content="coche del día, adivina coche, wordle de coches, juego de coches, quiz coches, trivia motor, adivina marca modelo año, juego diario coches, automovilismo, simracing" />
    <meta name="author" content="El Coche del Día" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <link rel="canonical" href="https://cochedeldia.com/" />
    <link rel="alternate" hreflang="es" href="https://cochedeldia.com/" />
    <link rel="alternate" hreflang="en" href="https://cochedeldia.com/" />
    <link rel="alternate" hreflang="x-default" href="https://cochedeldia.com/" />

    <link rel="preconnect" href="https://cloud.umami.is" crossorigin />
    <link rel="dns-prefetch" href="https://cloud.umami.is" />

    <!--
      Open Graph + Twitter Card.
      og:image se genera con scripts/generate-og-image.mjs (1200×630). Si
      cambias el diseño o el texto, regenera con:
        node scripts/generate-og-image.mjs
      y commitea el resultado. El CDN cachea por URL — si quieres invalidar
      un preview ya pegado en redes sociales, sube el bust query (?v=2).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="El Coche del Día" />
    <meta property="og:url" content="https://cochedeldia.com/" />
    <meta property="og:title" content="El Coche del Día · El reto diario para entusiastas del motor" />
    <meta property="og:description" content="¿Eres un experto en motor? Adivina marca, modelo y año del coche del día en 5 intentos. Nuevo coche cada 24h." />
    <meta property="og:image" content="https://cochedeldia.com/og-image.jpg?v=2" />
    <meta property="og:image:secure_url" content="https://cochedeldia.com/og-image.jpg?v=2" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="El Coche del Día — El reto diario de coches. Adivina marca, modelo y año en 5 intentos." />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://cochedeldia.com/" />
    <meta name="twitter:title" content="El Coche del Día · El reto diario de coches" />
    <meta name="twitter:description" content="Adivina marca, modelo y año del coche del día en 5 intentos. ¿Te atreves?" />
    <meta name="twitter:image" content="https://cochedeldia.com/og-image.jpg?v=2" />
    <meta name="twitter:image:alt" content="El Coche del Día — El reto diario de coches" />

    <!--
      Umami Analytics — privacy-first, sin cookies, ~1 KB.
      `data-domains` limita el envío al dominio real de producción para
      que las pruebas en localhost / preview-deploys no contaminen los
      datos. Durante la ventana de migración admitimos también
      carguessr.org para no perder los eventos que entren por el redirect
      308 durante las primeras semanas. Cuando consolides (en 30-60 días)
      puedes quitarlo y dejar solo cochedeldia.com.

      `data-website-id` es el mismo de siempre — un único website en Umami,
      solo cambia el dominio en su dashboard.
    -->
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="6d3e8cc0-401e-42b0-8cd4-dfc2a2748f1b"
      data-domains="cochedeldia.com,carguessr.org"
    ></script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "El Coche del Día",
      "url": "https://cochedeldia.com/",
      "description": "Adivina la marca, modelo y año del coche del día en 5 intentos. Un nuevo reto automovilístico cada 24 horas.",
      "applicationCategory": "GameApplication",
      "operatingSystem": "All",
      "browserRequirements": "Requires JavaScript",
      "inLanguage": ["es", "en"],
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR"
      },
      "author": {
        "@type": "Organization",
        "name": "El Coche del Día",
        "url": "https://cochedeldia.com/"
      },
      "image": "https://cochedeldia.com/og-image.jpg"
    }
    </script>
    </head>
  <body>
    <!-- (Se retiró el filtro de refracción SVG #cdd-liquid: solo lo soportaba
         Chromium y rompía la consistencia entre dispositivos. El "borde de
         cristal" ahora lo dan efectos UNIVERSALES — blur + glints cromáticos en
         las esquinas + canto — para que iPhone, Android y escritorio se vean
         igual. Ver index.css. -->

    <noscript>
      <div style="padding:2rem;text-align:center;color:#1b1712;background:#f3eee1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <h1 style="font-size:1.5rem;color:#b3271b">El Coche del Día</h1>
        <p style="margin-top:1rem;max-width:400px">Adivina la marca, modelo y año del coche del día en 5 intentos. Un nuevo reto automovilístico cada 24 horas. Activa JavaScript para jugar.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
