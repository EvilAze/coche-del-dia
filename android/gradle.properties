# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# --- Compatibilidad con AGP 9 -------------------------------------------------
# AGP 9 cambia una docena de valores por defecto de golpe. El asistente de
# actualización de Android Studio los fija AQUÍ al comportamiento de AGP 8 para
# que el salto de versión no cambie a la vez el build: primero se actualiza la
# herramienta, y cada default se adopta después por separado, sabiendo cuál es
# el que rompe si algo rompe.
#
# No son permanentes: AGP los irá marcando como obsoletos y hay que ir
# quitándolos de uno en uno, comprobando el AAB (peso y arranque en un móvil)
# tras cada uno. Los dos de R8 son los delicados, porque de R8 depende que el
# bundle pese ~5 MB y no ~9 (ver docs/android-build-release.md):
#
#   r8.strictFullModeForKeepRules  exige keep rules más explícitas. Las nuestras
#                                  llegan vía consumerProguardFiles de terceros
#                                  (@capacitor/android, androidx, GMS), así que
#                                  no las controlamos: en estricto, un fallo sale
#                                  como ClassNotFoundException en runtime, no en
#                                  compilación. Sigue apagada, y con motivo: lo
#                                  que Play echaba en falta no venía de aquí (ver
#                                  el bloque de R8 en build.gradle), así que
#                                  encenderla sería arriesgar el arranque a
#                                  cambio de casi nada.
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
# ADOPTADA (agosto de 2026): es el cuarto punto del aviso de Play. Medida con un
# assembleRelease antes y después: la poda nueva se lleva 47 recursos MENOS que
# la vieja (+32 KB de APK, un 0,8 %), así que el riesgo que temía el comentario
# de arriba —tirar algo referenciado solo por nombre— resulta ser aquí más
# pequeño, no más grande. Comprobado además que el icono de la notificación
# (drawable/ic_stat_cdd, el que la poda vieja se comió una vez) sigue en el APK
# con sus tres densidades y su tamaño real.
android.r8.optimizedResourceShrinking=true
android.builtInKotlin=false
android.newDsl=false
